<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Plotline</title>
    <meta name="description" content="A daily book and movie game: guess today’s famous book and movie from summaries exactly five words long." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" sizes="180x180" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Plotline" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Apply saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('plotline:v1') || '{}').settings || {};
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    </script>
    <style>
      /* Boot screen: paints before the JS bundle arrives. React replaces #root's
         contents on first render, so it disappears on its own. Colours mirror
         --bg, --tint and --tertiary in src/styles.css: a systemBlue book whose pages turn. */
      html { background: #ffffff; --boot-tint: #0062c4; --boot-page: #ffffff; --boot-line: rgb(60 60 67 / 0.3); }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) { background: #000000; --boot-tint: #409cff; --boot-page: #e5e5ea; --boot-line: rgb(60 60 67 / 0.35); }
      }
      html[data-theme='dark'] { background: #000000; --boot-tint: #409cff; --boot-page: #e5e5ea; --boot-line: rgb(60 60 67 / 0.35); }
      html[data-theme='light'] { background: #ffffff; --boot-tint: #0062c4; --boot-page: #ffffff; --boot-line: rgb(60 60 67 / 0.3); }
      .boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        opacity: 0; animation: boot-in 0.25s ease-out 0.15s forwards;
      }
      .boot-book { position: relative; width: 64px; height: 44px; perspective: 240px; }
      .boot-book::before {
        content: ''; position: absolute; inset: -4px -5px -5px; border-radius: 7px; background: var(--boot-tint);
      }
      .boot-page { position: absolute; top: 0; right: 0; width: 50%; height: 100%; background: var(--boot-page); border-radius: 0 3px 3px 0; }
      .boot-page.l { left: 0; right: auto; border-radius: 3px 0 0 3px; }
      .boot-page.flip { transform-origin: left center; animation: boot-flip 1.1s cubic-bezier(0.45, 0, 0.25, 1) infinite; }
      .boot-page.flip:nth-child(4) { animation-delay: 0.37s; }
      .boot-page.flip:nth-child(5) { animation-delay: 0.74s; }
      .boot-page::after {
        content: ''; position: absolute; left: 20%; right: 20%; top: 28%; height: 44%;
        background: repeating-linear-gradient(var(--boot-line) 0 2px, transparent 2px 6px);
      }
      @keyframes boot-in { to { opacity: 1; } }
      @keyframes boot-flip {
        0% { transform: rotateY(0deg); filter: brightness(1); }
        50% { filter: brightness(0.88); }
        100% { transform: rotateY(-180deg); filter: brightness(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot { animation-duration: 0s; }
        .boot-page.flip { animation: none; display: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading Plotline">
        <div class="boot-book">
          <div class="boot-page l"></div>
          <div class="boot-page"></div>
          <div class="boot-page flip"></div>
          <div class="boot-page flip"></div>
          <div class="boot-page flip"></div>
        </div>
      </div>
    </div>
    <noscript>Plotline needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
